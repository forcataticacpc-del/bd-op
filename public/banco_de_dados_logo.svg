<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradiente da borda dourada -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe29a"/>
      <stop offset="50%" stop-color="#c89d53"/>
      <stop offset="100%" stop-color="#8c6224"/>
    </linearGradient>

    <!-- Gradiente dos cilindros do banco de dados -->
    <linearGradient id="goldDiskTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe8a8"/>
      <stop offset="60%" stop-color="#deb46a"/>
      <stop offset="100%" stop-color="#b88c42"/>
    </linearGradient>

    <linearGradient id="goldDiskBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a67830"/>
      <stop offset="35%" stop-color="#eec77d"/>
      <stop offset="70%" stop-color="#dcae5b"/>
      <stop offset="100%" stop-color="#805619"/>
    </linearGradient>

    <!-- Brilho metálico sutil -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Sombra projetada dos discos -->
    <filter id="diskGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Fundo Preto com cantos arredondados -->
  <rect x="10" y="10" width="180" height="180" rx="34" ry="34" fill="#080a0e" />

  <!-- Borda Dourada Estilizada -->
  <rect x="14" y="14" width="172" height="172" rx="30" ry="30" fill="none" stroke="url(#goldBorder)" stroke-width="5" />

  <!-- Grupo dos Discos de Banco de Dados -->
  <g filter="url(#diskGlow)" transform="translate(0, 5)">
    <!-- DISCO 3 (INFERIOR) -->
    <!-- Corpo -->
    <path d="M 52,118 A 48,17 0 0,0 148,118 L 148,142 A 48,17 0 0,1 52,142 Z" fill="url(#goldDiskBody)" />
    <!-- Topo -->
    <ellipse cx="100" cy="118" rx="48" ry="17" fill="url(#goldDiskTop)" stroke="#664311" stroke-width="1.5" />

    <!-- DISCO 2 (MEIO) -->
    <!-- Corpo -->
    <path d="M 52,86 A 48,17 0 0,0 148,86 L 148,110 A 48,17 0 0,1 52,110 Z" fill="url(#goldDiskBody)" />
    <!-- Topo -->
    <ellipse cx="100" cy="86" rx="48" ry="17" fill="url(#goldDiskTop)" stroke="#664311" stroke-width="1.5" />

    <!-- DISCO 1 (SUPERIOR) -->
    <!-- Corpo -->
    <path d="M 52,54 A 48,17 0 0,0 148,54 L 148,78 A 48,17 0 0,1 52,78 Z" fill="url(#goldDiskBody)" />
    <!-- Topo com brilho -->
    <ellipse cx="100" cy="54" rx="48" ry="17" fill="url(#goldDiskTop)" stroke="#664311" stroke-width="1.5" />
    <ellipse cx="98" cy="52" rx="44" ry="14" fill="url(#highlight)" />
  </g>
</svg>
